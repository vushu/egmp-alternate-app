# Bluewink — nginx site config
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/bluewink
#   sudo ln -s /etc/nginx/sites-available/bluewink /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires a TLS cert (e.g. Let's Encrypt):
#   sudo certbot --nginx -d your-domain.dk
#
# The app must be running on 127.0.0.1:3000 (see deploy/bluewink.service).
# If you use a base path other than /, change the location block below to
# match (it must equal BLUEWINK_BASE_PATH on both build and server).

server {
    listen 443 ssl;
    server_name your-domain.dk;   # ← change to your domain

    ssl_certificate     /etc/letsencrypt/live/your-domain.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.dk/privkey.pem;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # ── The app (change /bil/kona if you use a different base path) ──
    location /bil/kona {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # Real client IP — required for the login rate limiter:
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # ── Manufacturer API proxy (same origin → no CORS problems) ────
    location /api-proxy/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # API calls can be slow (car wake-ups take ~10-30s)
        proxy_read_timeout 60s;
    }

    # Everything else → 404 (only the app path and /api-proxy are exposed)
    location / {
        return 404;
    }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name your-domain.dk;   # ← change to your domain
    return 301 https://$host$request_uri;
}
